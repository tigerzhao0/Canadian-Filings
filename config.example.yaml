# Canadian Annual Report PDF Finder — example configuration.
#
# Copy to config.yaml to customise (config.yaml is git-ignored so real keys
# never get committed). If you don't create config.yaml, these defaults are
# used as-is and the pipeline runs with NO keys via the DuckDuckGo backend.

search:
  # Which SearchProvider backend to use: "duckduckgo" (default, keyless,
  # can finish the whole list in one session) or "google_cse" (official API,
  # but the free tier caps at 100 queries/day so it can't finish in one run).
  provider: duckduckgo

  # Search query template. {name} is replaced with the company's legal name.
  query_template: '"{name}" investor relations annual report'

  # Max search results to consider per company.
  max_results: 8

  # Politeness for the search stage. DuckDuckGo throttles aggressively under
  # thousands of queries, so new search LAUNCHES are paced at least this many
  # seconds apart.
  min_delay_seconds: 2.5

  # How many searches can be in flight at once (still paced by min_delay_seconds
  # between launches — this doesn't remove the politeness delay, it just stops
  # the pacing from being wasted while waiting on each individual response).
  # Raise cautiously: if you start seeing more search_rate_limited /
  # search_error rows in needs_review, dial this back down.
  concurrency: 4

  # Retry/backoff when a search is rate-limited before giving up on a company
  # (the company then lands in needs_review with failure_reason=search_rate_limited).
  max_retries: 4
  backoff_base_seconds: 5.0    # 5, 10, 20, 40 ... with jitter
  backoff_max_seconds: 120.0

  # Google Custom Search — only used when provider: google_cse.
  # Leave blank to use the environment variables GOOGLE_CSE_API_KEY / GOOGLE_CSE_CX.
  google_cse:
    api_key: ""
    cx: ""     # Custom Search Engine id, configured to "search the entire web"

crawl:
  # Global cap on concurrent HTTP requests across all target domains. Safe to
  # raise well past core count since this is I/O-bound (waiting on remote
  # servers, not local CPU) and per_domain_delay_seconds below already caps
  # how hard any SINGLE company's site gets hit regardless of this number —
  # raising it only adds more breadth across DIFFERENT companies in parallel.
  max_concurrency: 24
  # Minimum seconds between requests to the SAME domain.
  per_domain_delay_seconds: 1.0
  # How many hops to follow from the IR homepage toward a reports page.
  max_hops: 3
  # Max pages fetched per company during the static crawl (safety cap).
  max_pages: 25
  # Per-request timeout (seconds).
  timeout_seconds: 20
  # Honest, descriptive User-Agent for the polite static crawl + robots.txt.
  user_agent: "CanadianARFinder/1.0 (+annual-report research bot; contact: you@example.com)"
  # Realistic browser User-Agent used by the headless-browser render pass and as
  # a fallback when a CDN returns 403 to the bot UA during PDF validation (many
  # IR-site CDNs block non-browser clients outright).
  browser_user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  # Respect robots.txt (strongly recommended; leave true).
  respect_robots: true

# Tier-2 headless-browser pass (Playwright) for JS-heavy IR sites. Runs only
# over companies Tier 1 couldn't resolve. Requires a one-time:
#   pip install playwright && playwright install chromium
# If Playwright isn't installed this tier is skipped automatically.
render:
  enabled: true
  concurrency: 8           # concurrent headless pages, each a lightweight
                           # context in the one shared Chromium process (same
                           # deal as tmx.concurrency below — scales with RAM/
                           # CPU, not process count). Independent from
                           # tmx.concurrency now, so this only affects Tier 2.
  max_hops: 3             # hops to follow within the rendered IR site
  max_pages: 16           # page-render cap per company
  timeout_seconds: 30

# SEC EDGAR flagging. Companies that file with the SEC (10-K/40-F/20-F) and have
# no first-party PDF are flagged as sec_filer (with a link to their latest annual
# filing) and excluded from the manual-review queue — a first-party IR PDF is
# still preferred and used when found. Never uses SEDAR.
# Year-pattern URL extrapolation (step 1, runs last): companies whose verified
# pdf_url embeds the fiscal year in the filename (rbc.com's ar_2025_e.pdf) get
# earlier years probed at the same path -- fills the 10-year history cheaply.
probe_year_patterns: true

# annualreports.com structured-URL source (step 1, runs FIRST -- cheapest).
# The site hosts real annual reports at deterministic
# {EXCH}_{TICKER}_{YEAR}.pdf paths (TSX / TSX-V / OTC prefixes) -- pure
# pattern GETs, no scraping. Fails soft when the site is unreachable.
# Disabled: confirmed 2026-07-16 that annualreports.com TCP-blocks this
# network's IP range entirely (ping replies fine, every HTTP request times
# out -- not a rate limit, no config here unblocks it). Re-enable if running
# from a different network (e.g. mobile hotspot got through before).
annualreports:
  enabled: false
  # Good-citizen politeness (NOT bot-block evasion): low concurrency + a global
  # pacer + polite backoff so we don't trip a rate-limiter. If the site
  # deliberately blocks the network's IP range (server answers ping but drops
  # all TCP -- observed from cloud/broadband, only mobile got through), NO
  # config here unblocks it; run from a non-blocked network instead.
  concurrency: 3            # kept low on purpose
  min_delay_seconds: 1.0    # global min gap between requests to the host
  max_retries: 3            # polite exponential backoff on a 429/403 "blocked"

sec:
  enabled: true
  # SEC fair-access asks for a User-Agent identifying you with a contact email.
  user_agent: "CanadianARFinder/1.0 (contact: you@example.com)"

# Content verification of first-party PDFs. When on, a candidate that validates
# as a reachable PDF is also downloaded and its text checked to confirm it reads
# like a financial statement / annual report — rejecting cover letters, "annual
# filing coming soon" notices, and terms pages that a filename heuristic can be
# fooled by. Only rejects clear non-statements; scanned/unparseable PDFs are
# accepted. Applies to first-party sources (crawl / PDF search / render) and
# CSE. TMX's GraphQL filings pass (tmx_filings_api) does NOT read this flag --
# it always skips content verification, since TMX's own API already labels
# each filing's type ("Annual report" / "Audited annual financial
# statements") before a URL is even considered, so a redundant per-candidate
# PDF download+parse isn't needed there.
verify:
  content_check: true
  max_pdf_mb: 40          # skip verification for PDFs larger than this

# CSE (Canadian Securities Exchange / XCNQ) filings fallback. For CSE-listed
# companies with no first-party PDF, pulls the latest ANNUAL_FINANCIAL_STATEMENTS
# from the exchange's own public API and records it tagged discovery_method
# 'cse_filings'. These documents originate from SEDAR (CSE-mirrored on
# sedar-filings-backup.thecse.com); sedarplus.ca is never accessed. First-party
# IR PDFs are always preferred and used when found.
cse:
  enabled: true
  concurrency: 15          # plain HTTP calls to thecse.com's own API — cheap,
                           # safe to raise well above the browser-driven passes

# TSX / TSX-V PDF filings fallback. Queries TMX Money's own GraphQL API
# (app-money.tmx.com/graphql, getCompanyFilings) directly -- no browser
# needed, no auth token required (just Origin/Referer headers identifying
# the request as coming from money.tmx.com). Finds "Audited annual financial
# statements" PDFs, tagged 'tmx_filings_api'. Fires on every default
# `run.py --step 1` run for unresolved TSX/TSXV/XTSE/XTSX companies not
# already flagged SEC -- this is NOT dormant in normal use.
tmx:
  enabled: true
  concurrency: 15         # concurrent plain-HTTP GraphQL requests (not
                          # browser contexts -- this stage no longer uses
                          # Playwright at all). Started at the same cautious
                          # value already tuned for cse.concurrency above;
                          # only tested at low/sequential request volume so
                          # far, so raise gradually and watch for 429s/errors
                          # before trusting a much higher value at full scale.

# Structured TSX/TSXV financials (Income Statement / Balance Sheet / Cash
# Flow) pulled straight from QuoteMedia's public "datatool" widget API —
# see tmx_financials.py for how this endpoint was found and how it's called.
# Only used when run.py is invoked with --financials; writes to its own DB
# (financials_pipeline.py / schema_financials.sql), separate from filings.db
# since the two don't share a schema. This data will be joined/integrated
# with the PDF-finder results (and, later, the CSE LLM-extraction output)
# downstream.
# run.py --step 3 --method rules (deterministic, no-LLM extraction). Writes to
# its OWN db -- SEPARATE from QuoteMedia's financials.db above -- so a ticker
# QuoteMedia already covers keeps its real values as a ground-truth comparison
# set, and rule output can be checked against it (see rule_extract.compare_to_quotemedia).
rules:
  db_path: "output/pdf_financials.db"
  # vocab_path: "data/canonical_lineitems.json"   # (default) the canonical target keys
  # Step 4 (schema mapping) is CPU-bound (regex/alias matching per line item)
  # and fully parallel across tickers -- one ProcessPoolExecutor worker per
  # ticker, no shared state (default: min(20, cpu_count)).
  # process_workers: 20

tmx_financials:
  db_path: "output/financials.db"
  concurrency: 25         # EMPIRICALLY TUNED, not a guess -- benchmarked the
                          # full 1990-company batch at 5/10/15/18/20/22/25/30/
                          # 40/80/150/300 and timed each. Counterintuitively
                          # this ISN'T monotonic: throughput peaks right here
                          # (~10.2-11.0s, ~190 req/s, confirmed over 3 trials)
                          # and gets WORSE in both directions -- concurrency=5
                          # took 47s, concurrency=300 took 32s. Past ~25,
                          # per-connection overhead (TLS handshake churn, pool
                          # contention) outweighs the extra parallelism; below
                          # it, there just aren't enough requests in flight.
                          # Re-benchmark if QuoteMedia's backend changes.
  timeout_seconds: 20
  # How many annual reports (years) to request per company. QuoteMedia caps its
  # enhanced-financials endpoint at ~14 years of history regardless (a rolling
  # retention window -- deep filers like RY/BMO/ENB return 2025..2012 whether you
  # ask for 15, 30, or 50), so 20 just pulls the full available window with a
  # safe margin. Asking for more than the cap is harmless (returns the max, no
  # error). Raising this deepens history but grows financials.db proportionally.
  num_years: 20

# GuruFocus API comparison (src/gurufocus_compare.py) -- a QA/validation tool that
# diffs our PDF-extracted numbers against GuruFocus's fundamentals. The api_token is
# resolved config-first, then the GURUFOCUS_API_TOKEN env var (same pattern as the
# Google-CSE key above). Leave api_token blank here and set it in your git-ignored
# config.yaml (or the env var) so the real token never commits. Each call is a PAID
# request, so responses are cached under cache_dir and reused across runs
# (--from-cache replays the cache with no network calls at all).
gurufocus:
  api_token: ""                       # or export GURUFOCUS_API_TOKEN
  # Token goes in the URL PATH: /public/user/{token}/stock/{EXCH:SYM}/financials
  base_url: "https://api.gurufocus.com/public/user"
  cache_dir: "output/gurufocus_cache"
  timeout_seconds: 20
  tolerance_pct: 2.0                  # a metric within this %% of GuruFocus counts as a match

storage:
  # SQLite database file (created if missing).
  db_path: "output/filings.db"

# Path to the editable domain blocklist (non-corporate hosts to ignore).
blocklist_path: "data/blocklist.txt"

# run.py --step 2 (PDF processing: download -> extract statement text -> delete).
# Parsing (PyMuPDF, with a pdfplumber fallback) runs in a separate worker-
# process pool from the download step (plain I/O waits) -- the two no longer
# share one bottleneck. Both are deliberately kept modest by default: every
# in-flight download holds a full PDF in memory (sometimes 20-30MB), and each
# parse worker holds one PDF's parsed representation -- concurrency x
# process_workers-many of those in flight at once adds up on a typical
# desktop's RAM. Raise only after confirming you have the memory headroom.
pdf_processing:
  # Raised again after fixing a real bug: `sem` used to wrap BOTH the
  # download AND the parse-and-wait, so a row mid-parse kept occupying a
  # download slot the whole time -- most of the 24 slots ended up held by
  # in-progress parses, throttling downloads well below what the network/
  # process pool could actually sustain. Decoupled: `sem` now gates ONLY the
  # download; parse concurrency is capped independently by process_workers
  # via the ProcessPoolExecutor's own queue. Confirmed via a real 50-company/
  # 850-PDF run: 0 rate-limit hits, peak memory only ~2.2GB, ~2.9x faster
  # per-PDF than the coupled version. Pushing further since there's still
  # large headroom on both fronts.
  # NOTE: "idle" system memory (background apps, OS, browser) already uses
  # a meaningful chunk of a typical desktop's total RAM -- check actual free
  # memory before raising these further, not just total installed RAM.
  concurrency: 48         # concurrent PDF downloads -- I/O-bound, no
                          # rate-limiting observed yet at 24; watch for 429s/
                          # repeated failures if raising further.
  process_workers: 20     # worker processes for PDF text-extraction/parsing
                          # (ProcessPoolExecutor -- ProcessPool gets true
                          # multi-core parallelism for this pure-Python, CPU-
                          # heavy work; a thread pool would still serialize on
                          # the GIL). Capped at 20 -- this machine's actual
                          # logical processor count; going above that
                          # oversubscribes the CPU (context-switching
                          # overhead) for work that's genuinely CPU-bound
                          # most of the time, so it isn't free upside the way
                          # download concurrency is. Defaults to
                          # min(4, os.cpu_count()) -- deliberately NOT "one
                          # per core" by default: this is memory-bound, not
                          # just CPU-bound, so more cores doesn't
                          # automatically mean it's safe to run more of these
                          # at once on every machine.
  parse_timeout_seconds: 900  # wall-clock cap on ONE PDF's CPU-bound parse
                          # step (pdfplumber/pdfminer text extraction),
                          # separate from the download timeout above. Without
                          # this, a single pathological PDF can spin a worker
                          # process forever with no exception raised --
                          # observed on a full-backlog run: one large
                          # multinational's annual report spun for 2.9+ hours
                          # (vs ~45min for sibling workers' entire batches)
                          # and blocked the run from ever finishing, even
                          # with 99.95% of rows already done. A timeout here
                          # is recorded as a normal failed row
                          # (reason="parse_timeout") and the run continues.

# LEGACY / opt-in only -- the default pipeline (step 3 line-item parsing +
# step 4 --method rules, both deterministic) never reads this section; `enabled`
# below isn't consulted by any code path. Reached only via
# `run.py --step 4 --method llm`, which reads the raw statement text step 2
# stored in filings.db `pdf_extractions`, maps each statement onto the canonical
# QuoteMedia line-item vocabulary via a LOCAL Ollama model, and writes the
# numbers into financials.db (companies/company_years/statement_lines, tagged
# source='cse_pdf_extract'). Requires a local Ollama server (https://ollama.com):
#   pip install ollama
#   ollama pull qwen2.5:7b-instruct-q4_K_M
# Tuned for a 10GB GPU (RTX 3080): 7B Q4 weights (~4.7GB) + 16k context fit fully
# on-GPU. The stage is GPU-serial, so it runs as one synchronous pass.
llm:
  enabled: false
  backend: ollama
  base_url: "http://localhost:11434"
  model: "qwen2.5:7b-instruct-q4_K_M"
  temperature: 0          # deterministic extraction
  num_ctx: 16384          # a single statement section fits comfortably
  keep_alive: "30m"       # hold the model resident in VRAM across the batch
  request_timeout_s: 120
  vocab_path: "data/canonical_lineitems.json"   # generated by src/build_vocab.py
  prompt_version: "v1"
  # Ask for all 3 statements (income/balance/cash) in ONE call per pdf row
  # instead of 3 separate calls -- cuts LLM round trips 3x, the single biggest
  # speed lever (each call pays fixed schema-grammar/prompt-prefill overhead
  # regardless of statement count). Set false to fall back to the original
  # one-call-per-statement path if combined accuracy ever looks worse.
  combine_statements: true
  # Fire this many pdf-row fetches concurrently (thread pool). A single GPU
  # ultimately serializes generation, but network/JSON-parse overhead can still
  # overlap, and Ollama can internally batch concurrent requests if
  # OLLAMA_NUM_PARALLEL is set on the server. Raise cautiously -- each
  # concurrent request needs its own KV-cache slot in VRAM.
  concurrency: 1
  # Optional higher-accuracy 2nd pass on rows the primary model errors on. Off by
  # default: a 14B Q4 (~9GB) partially offloads to CPU on a 10GB card and is slow.
  fallback_model: "qwen2.5:14b-instruct-q4_K_M"
  use_fallback_on_invalid: false

pilot:
  # Default sample size for --pilot when --sample-size isn't given.
  default_sample_size: 40
